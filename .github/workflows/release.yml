name: Release

# Publishes to npm when a version tag is pushed, e.g.:
#   npm version patch && git push --follow-tags
#
# Requires a repository secret named NPM_TOKEN. It must be a token type that can
# publish non-interactively: a Classic **Automation** token, or a Granular token
# with "Bypass two-factor authentication" enabled. Classic "Publish" tokens and
# granular tokens without that checkbox fail with E403/EOTP.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish --dry-run only'
        type: boolean
        default: false

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; token publishing works
      # with either version, so upgrading keeps both paths available.
      - run: npm install -g npm@^11

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify tarball contents
        run: npm pack --dry-run

      - name: Check npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN secret is empty. Add an npm Automation token."
            exit 1
          fi
          npm whoami || {
            echo "::error::npm rejected the token before publishing. Regenerate NPM_TOKEN as an Automation token."
            exit 1
          }

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run
            exit 0
          fi

          # Default is staged publishing: npm requires a human with 2FA to
          # approve every release on accounts that cannot do a non-interactive
          # publish. Set the repository variable NPM_PUBLISH_MODE=direct once a
          # trusted publisher (OIDC) with direct publish permission is set up.
          MODE="${{ vars.NPM_PUBLISH_MODE || 'staged' }}"
          echo "publish mode: $MODE"

          if [ "$MODE" = "direct" ]; then
            if npm publish --provenance --access public 2>&1 | tee publish.log; then
              echo "::notice::published directly"
              exit 0
            fi
            if grep -q 'E_STAGE_REQUIRED' publish.log; then
              echo "::warning::token is stage-only — falling back to staged publishing"
            elif grep -qE 'E403|EOTP|two-factor' publish.log; then
              echo "::error::npm refused the token (2FA). Set NPM_PUBLISH_MODE=staged, or configure trusted publishing."
              exit 1
            else
              exit 1
            fi
          fi

          npm stage publish --provenance 2>&1 | tee stage.log
          npm stage list 2>&1 | tee -a stage.log || true

          STAGE_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' stage.log | head -1 || true)
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "### ${NAME}@${VERSION} is staged — approval required"
            echo ''
            echo 'npm requires a maintainer with 2FA to approve staged releases.'
            echo ''
            echo '- **Web:** open the *Staged Packages* tab on npmjs.com and click **Approve**'
            echo "- **CLI:** \`npm stage approve ${STAGE_ID:-<stage-id>}\`"
            echo ''
            echo '```'
            echo "stage id: ${STAGE_ID:-see npm stage list}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::staged $NAME@$VERSION${STAGE_ID:+ (stage id $STAGE_ID)} — approve it on npmjs.com"

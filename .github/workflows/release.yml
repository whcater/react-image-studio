name: Release

# Publishes to npm when a version tag is pushed, e.g.:
#   npm version patch && git push --follow-tags
#
# Requires a repository secret named NPM_TOKEN. It must be a token type that can
# publish non-interactively: a Classic **Automation** token, or a Granular token
# with "Bypass two-factor authentication" enabled. Classic "Publish" tokens and
# granular tokens without that checkbox fail with E403/EOTP.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish --dry-run only'
        type: boolean
        default: false

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; token publishing works
      # with either version, so upgrading keeps both paths available.
      - run: npm install -g npm@^11

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify tarball contents
        run: npm pack --dry-run

      - name: Check npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN secret is empty. Add an npm Automation token."
            exit 1
          fi
          npm whoami || {
            echo "::error::npm rejected the token before publishing. Regenerate NPM_TOKEN as an Automation token."
            exit 1
          }

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run
            exit 0
          fi

          # Preferred path: direct publish. Works with trusted publishing (OIDC),
          # a bypass-2FA token on an existing package, or an OTP-free account.
          if npm publish --provenance --access public 2>&1 | tee publish.log; then
            echo "::notice::published ${{ github.event.repository.name }} directly"
            node -p "'published ' + require('./package.json').name + '@' + require('./package.json').version"
            exit 0
          fi

          # Stage-only tokens (the npm default for 2FA accounts since 2026) may
          # only queue a release; a maintainer approves it with 2FA afterwards.
          if grep -q 'E_STAGE_REQUIRED' publish.log; then
            echo "::warning::NPM_TOKEN is stage-only — staging the release for maintainer approval"
            npm stage publish --provenance 2>&1 | tee stage.log
            npm stage list 2>&1 | tee -a stage.log || true
            {
              echo "### Release staged, waiting for approval"
              echo ''
              echo 'The `NPM_TOKEN` in this repository can only stage releases.'
              echo 'A maintainer must approve it with 2FA:'
              echo ''
              echo '```bash'
              echo 'npm stage list'
              echo 'npm stage approve <stage-id>   # prompts for the 2FA code'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -qE 'E403|EOTP|two-factor' publish.log; then
            echo "::error::npm refused the token (2FA). Use trusted publishing (OIDC), or a token that can bypass 2FA for publishing."
          fi
          exit 1

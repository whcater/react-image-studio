<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>react-image-studio · live demo</title>
    <link rel="stylesheet" href="../dist/style.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 20% -10%, #1d2b4a 0%, #0b0d12 60%);
        color: #e7ecf5;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .shell {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
        padding: 16px;
        box-sizing: border-box;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .brand h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.01em;
      }
      .brand code {
        font-size: 12px;
        color: #8aa0c0;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .controls button,
      .controls select {
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
      }
      .controls button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .editor {
        flex: 1 1 auto;
        min-height: 0;
      }
      .log {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 12px;
        color: #93a4bf;
        min-height: 18px;
      }
      .log b {
        color: #9ff0c0;
        font-weight: 600;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
